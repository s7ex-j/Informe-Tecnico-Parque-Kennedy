name: Compilar informe

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar Informe.tex (pdflatex + bibtex vía latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Informe.tex
          working_directory: Informe
      - uses: actions/upload-artifact@v4
        with:
          name: informe-pdf
          path: Informe/Informe.pdf
